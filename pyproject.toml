[project]
name = "abss"
version = "0.1.0"
description = "Autonomous Business Strategy Simulator"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.116",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "pyright>=1.1",
    "httpx2>=2.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
